name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web bundle & sync Capacitor
        working-directory: frontend
        run: npm run build:mobile

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install

      - name: Build Xcode Archive (Unsigned)
        working-directory: frontend/ios/App
        run: |
          VER="$(node -p "require('../../package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' ../../android/app/build.gradle | sed -n 1p)"
          echo "Building openGym $VER ($BUILD)..."
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package .ipa
        working-directory: frontend/ios/App
        run: |
          mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr openGym-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-unsigned-ipa
          path: frontend/ios/App/openGym-unsigned.ipa
          if-no-files-found: error
